<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cluedo P2P WebRTC</title>
  <!-- Libreria PeerJS per gestire la connessione WebRTC senza backend proprietario -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; touch-action: manipulation; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    .panel { background: #1e293b; padding: 16px; border-radius: 12px; width: 100%; max-width: 360px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #334155; }
    input, button { padding: 12px; border-radius: 8px; border: none; font-size: 15px; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; }
    button { background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

    #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; gap: 10px; margin-top: 10px; }
    #status { width: 100%; background: #1e293b; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; border-left: 4px solid #f59e0b; }
    canvas { background: #020617; border: 2px solid #334155; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- LOBBY DI CONNESSIONE P2P -->
  <div id="lobby" class="panel">
    <h3 style="color: #f59e0b; text-align: center;">CLUEDO P2P (WebRTC)</h3>
    <input type="text" id="username" placeholder="Tuo Nome">
    
    <div style="display:flex; flex-direction:column; gap:6px; margin-top: 6px;">
      <button onclick="createGame()">CREA STANZA (FA DA HOST)</button>
      <div style="text-align:center; font-size: 12px; color: #94a3b8;">oppure</div>
      <input type="text" id="joinId" placeholder="Incolla Codice Stanza Host">
      <button onclick="joinGame()" style="background: #3b82f6; color: #fff;">ENTRA NELLA STANZA</button>
    </div>
    
    <div id="host-code-display" style="display:none; word-break: break-all; background: #0f172a; padding: 8px; border-radius: 6px; font-size: 12px; border: 1px dashed #f59e0b;"></div>
  </div>

  <!-- AREA DI GIOCO -->
  <div id="game-container">
    <div id="status">Connessione in corso...</div>
    <canvas id="board"></canvas>
    <button id="diceBtn" onclick="rollDice()" disabled>TIRA IL DADO</button>
  </div>

  <script>
    let peer = null;
    let isHost = false;
    let connections = []; // Solo per l'Host: lista socket P2P verso i client
    let hostConn = null;  // Per i client: connessione verso l'Host

    let myId = null;
    let myName = '';
    
    // Stato di gioco gestito dall'Host
    let gameState = {
      players: [],
      turnIndex: 0,
      stepsLeft: 0
    };

    const TILE = 30;
    const GRID_SIZE = 10;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    canvas.width = GRID_SIZE * TILE;
    canvas.height = GRID_SIZE * TILE;

    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];

    // 1. CREAZIONE STANZA (HOST)
    function createGame() {
      myName = document.getElementById('username').value.trim() || 'Host';
      isHost = true;
      peer = new Peer(); // Genera un ID univoco sui server gratuiti PeerJS

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('host-code-display').style.display = 'block';
        document.getElementById('host-code-display').innerHTML = `Condividi questo codice con gli amici:<br><strong>${id}</strong>`;
        
        // Aggiungi l'host come primo giocatore
        gameState.players.push({ id: myId, name: myName, color: COLORS[0], x: 0, y: 0 });
        showGameView();
        updateUI();
      });

      // L'Host ascolta le connessioni in entrata dai telefoni degli amici
      peer.on('connection', (conn) => {
        connections.push(conn);

        conn.on('data', (data) => {
          handleIncomingMessageAsHost(data, conn);
        });

        conn.on('close', () => {
          gameState.players = gameState.players.filter(p => p.id !== conn.peer);
          broadcastState();
        });
      });
    }

    // 2. ACCESSO A STANZA ESISTENTE (CLIENT)
    function joinGame() {
      myName = document.getElementById('username').value.trim() || 'Ospite';
      const targetHostId = document.getElementById('joinId').value.trim();
      if (!targetHostId) return alert('Inserisci il codice fornito da chi ha creato la stanza');

      isHost = false;
      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        hostConn = peer.connect(targetHostId);

        hostConn.on('open', () => {
          showGameView();
          // Notifica all'Host il proprio ingresso
          hostConn.send({ type: 'JOIN', name: myName });
        });

        // Il client riceve lo stato aggiornato direttamente dall'Host
        hostConn.on('data', (data) => {
          if (data.type === 'SYNC') {
            gameState = data.state;
            updateUI();
          }
        });
      });
    }

    // 3. LOGICA DI VALIDAZIONE (GIRATA DALL'HOST)
    function handleIncomingMessageAsHost(data, conn) {
      if (data.type === 'JOIN') {
        const pIndex = gameState.players.length;
        const color = COLORS[pIndex % COLORS.length];
        // Posiziona i nuovi arrivati su angoli diversi
        const spawns = [{x: 0, y: 0}, {x: 9, y: 0}, {x: 0, y: 9}, {x: 9, y: 9}];
        const spawn = spawns[pIndex % spawns.length];

        gameState.players.push({
          id: conn.peer,
          name: data.name,
          color: color,
          x: spawn.x,
          y: spawn.y
        });
        broadcastState();
      }

      if (data.type === 'ACTION_ROLL') {
        if (gameState.players[gameState.turnIndex].id === conn.peer && gameState.stepsLeft === 0) {
          gameState.stepsLeft = Math.floor(Math.random() * 6) + 1;
          broadcastState();
        }
      }

      if (data.type === 'ACTION_MOVE') {
        executeMove(conn.peer, data.x, data.y);
      }
    }

    function executeMove(playerId, targetX, targetY) {
      const activePlayer = gameState.players[gameState.turnIndex];
      if (activePlayer.id !== playerId || gameState.stepsLeft <= 0) return;

      const dx = Math.abs(activePlayer.x - targetX);
      const dy = Math.abs(activePlayer.y - targetY);

      if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
        activePlayer.x = targetX;
        activePlayer.y = targetY;
        gameState.stepsLeft--;

        if (gameState.stepsLeft === 0) {
          gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
        }

        if (isHost) broadcastState();
      }
    }

    // Invia lo stato aggiornato a tutti i client collegati
    function broadcastState() {
      connections.forEach(conn => {
        if (conn.open) conn.send({ type: 'SYNC', state: gameState });
      });
      updateUI();
    }

    // 4. AZIONI LOCALI
    function rollDice() {
      if (isHost) {
        if (gameState.players[gameState.turnIndex].id === myId && gameState.stepsLeft === 0) {
          gameState.stepsLeft = Math.floor(Math.random() * 6) + 1;
          broadcastState();
        }
      } else {
        hostConn.send({ type: 'ACTION_ROLL' });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      const activePlayer = gameState.players[gameState.turnIndex];
      if (!activePlayer || activePlayer.id !== myId || gameState.stepsLeft <= 0) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor(((e.clientX - rect.left) * scaleX) / TILE);
      const y = Math.floor(((e.clientY - rect.top) * scaleY) / TILE);

      if (isHost) {
        executeMove(myId, x, y);
      } else {
        hostConn.send({ type: 'ACTION_MOVE', x, y });
      }
    });

    // 5. INTERFACCIA E RENDERING
    function showGameView() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
    }

    function updateUI() {
      draw();
      const activePlayer = gameState.players[gameState.turnIndex];
      if (!activePlayer) return;

      const isMyTurn = (activePlayer.id === myId);
      const statusDiv = document.getElementById('status');
      const diceBtn = document.getElementById('diceBtn');

      if (isMyTurn) {
        if (gameState.stepsLeft > 0) {
          statusDiv.innerHTML = `<strong>Tocca a te!</strong> Passi rimasti: <strong>${gameState.stepsLeft}</strong> (Tocca casella adiacente)`;
          diceBtn.disabled = true;
        } else {
          statusDiv.innerHTML = `<strong>Tocca a te!</strong> Tira il dado.`;
          diceBtn.disabled = false;
        }
      } else {
        statusDiv.innerHTML = `Turno di: <strong>${activePlayer.name}</strong>`;
        diceBtn.disabled = true;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Griglia tabellone
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = '#334155';
          ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
      }

      // Pedine
      gameState.players.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x * TILE + TILE / 2, p.y * TILE + TILE / 2, TILE / 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        if (p.id === myId) {
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('IO', p.x * TILE + TILE / 2, p.y * TILE + TILE / 1.5);
        }
      });
    }
  </script>
</body>
</html>
