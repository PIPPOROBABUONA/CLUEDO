      <button id="disprove-none-btn" onclick="passDisprove()" style="background: #475569; color: #fff; margin-top: 12px; font-size: 13px; padding: 10px;">NON HO NESSUNA CARTA</button>

  <!-- MODALE LE MIE CARTE -->
<!-- ... existing code ... -->
  <script>
    let peer = null;
    let isHost = false;
    let connections = [];
    let hostConn = null;
    let myId = null;
    let myName = '';
    let roomPassword = '';
    
    let gameState = {
      started: false,
      players: [],
      turnIndex: 0,
      stepsLeft: 0,
      activeSuggestion: null // Stato chiamata in corso
    };

    let myCards = [];
    let secretCaseFile = null;
    let notebookState = {};

    const ALL_CARDS = {
      suspects: [
        'Miss Scarlett', 'Colonnello Mustard', 'Dottor Orchid', 
        'Reverendo Green', 'Signora Peacock', 'Professor Plum'
      ],
      weapons: [
        'Candeliere', 'Pugnale', 'Tubo di Piombo', 
        'Rivoltella', 'Corda', 'Chiave Inglese'
      ],
      rooms: [
        'Cucina', 'Sala da Ballo', 'Veranda', 
        'Sala da Pranzo', 'Sala da Biliardo', 'Salotto', 
        'Studio', 'Biblioteca', 'Ingresso'
      ]
    };

    const TILE = 30;
    const GRID_SIZE = 10;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    canvas.width = GRID_SIZE * TILE;
    canvas.height = GRID_SIZE * TILE;

    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    // 1. CREAZIONE STANZA (HOST)
    function createGame() {
      myName = document.getElementById('username').value.trim() || 'Host';
      roomPassword = document.getElementById('hostPassword').value.trim();
      isHost = true;

      showWaitingScreen();
      document.getElementById('display-room-code').textContent = 'Creazione in corso...';
      document.getElementById('host-start-container').style.display = 'block';

      try {
        peer = new Peer(PEER_CONFIG);
      } catch (err) {
        showCustomAlert('Errore PeerJS. Esegui il file tramite HTTPS o server locale.');
        return;
      }

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('display-room-code').textContent = id;
        
        gameState.players = [{ id: myId, name: myName, color: COLORS[0], x: 0, y: 0, isHost: true }];
        updateWaitingRoomUI();
      });

      peer.on('error', (err) => {
        showCustomAlert('Errore di connessione: ' + err.type);
      });

      peer.on('connection', (conn) => {
        connections.push(conn);

        conn.on('data', (data) => {
          handleIncomingMessageAsHost(data, conn);
        });

        conn.on('close', () => {
          gameState.players = gameState.players.filter(p => p.id !== conn.peer);
          connections = connections.filter(c => c !== conn);
          broadcastState();
          updateWaitingRoomUI();
        });
      });
    }

    // 2. ACCESSO ALLA STANZA (CLIENT)
    function joinGame() {
      myName = document.getElementById('username').value.trim() || 'Ospite';
      const targetHostId = document.getElementById('joinId').value.trim();
      const enteredPass = document.getElementById('joinPassword').value.trim();
      if (!targetHostId) return showCustomAlert('Incolla il codice stanza generato dall\'Host');

      isHost = false;
      showWaitingScreen();
      document.getElementById('display-room-code').textContent = targetHostId;
      document.getElementById('client-waiting-msg').style.display = 'block';

      peer = new Peer(PEER_CONFIG);

      peer.on('open', (id) => {
        myId = id;
        hostConn = peer.connect(targetHostId);

        hostConn.on('open', () => {
          hostConn.send({ type: 'JOIN', name: myName, password: enteredPass });
        });

        hostConn.on('data', (data) => {
          if (data.type === 'AUTH_FAILED') {
            showCustomAlert('Password errata per questa stanza!');
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            peer.destroy();
            return;
          }
          if (data.type === 'SYNC') {
            gameState = data.state;
            if (gameState.started) {
              showGameView();
              updateUI();
            } else {
              updateWaitingRoomUI();
            }
          }
          if (data.type === 'DEAL_CARDS') {
            myCards = data.cards;
            renderMyCards();
            initNotebook();
          }
          if (data.type === 'PROMPT_DISPROVE') {
            openDisproveModal(data.suggestion);
          }
          if (data.type === 'SUGGESTION_RESULT') {
            handleSuggestionResult(data);
          }
        });

        hostConn.on('error', () => {
          showCustomAlert('Impossibile collegarsi alla stanza. Verifica il codice.');
        });
      });

      peer.on('error', (err) => {
        showCustomAlert('Errore Peer: ' + err.type);
      });
    }

    // 3. LOGICA DI GIOCO SUL TELEFONO DELL'HOST
    function handleIncomingMessageAsHost(data, conn) {
      if (data.type === 'JOIN') {
        if (roomPassword && data.password !== roomPassword) {
          conn.send({ type: 'AUTH_FAILED' });
          setTimeout(() => conn.close(), 500);
          return;
        }

        const pIndex = gameState.players.length;
        const color = COLORS[pIndex % COLORS.length];
        const spawns = [{x: 0, y: 0}, {x: 9, y: 0}, {x: 0, y: 9}, {x: 9, y: 9}, {x: 4, y: 0}, {x: 4, y: 9}];
        const spawn = spawns[pIndex % spawns.length];

        gameState.players.push({
          id: conn.peer,
          name: data.name,
          color: color,
          x: spawn.x,
          y: spawn.y,
          isHost: false
        });

        broadcastState();
        updateWaitingRoomUI();
      }

      if (data.type === 'ACTION_ROLL') {
        if (gameState.players[gameState.turnIndex].id === conn.peer && gameState.stepsLeft === 0 && !gameState.activeSuggestion) {
          gameState.stepsLeft = Math.floor(Math.random() * 6) + 1;
          broadcastState();
        }
      }

      if (data.type === 'ACTION_MOVE') {
        executeMove(conn.peer, data.x, data.y);
      }

      if (data.type === 'START_SUGGESTION') {
        initiateSuggestion(conn.peer, data.suggestion);
      }

      if (data.type === 'DISPROVE_RESPONSE') {
        processDisproveResponse(conn.peer, data.card, data.hasCard);
      }
    }

    function startGame() {
      if (!isHost) return;
      if (gameState.players.length < 1) return showCustomAlert('Attendi almeno un giocatore');

      distributeCardsAndSetCaseFile();
      gameState.started = true;
      broadcastState();
      showGameView();
      updateUI();
    }

    function distributeCardsAndSetCaseFile() {
      const suspects = [...ALL_CARDS.suspects];
      const weapons = [...ALL_CARDS.weapons];
      const rooms = [...ALL_CARDS.rooms];

      const rSuspect = suspects.splice(Math.floor(Math.random() * suspects.length), 1)[0];
      const rWeapon = weapons.splice(Math.floor(Math.random() * weapons.length), 1)[0];
      const rRoom = rooms.splice(Math.floor(Math.random() * rooms.length), 1)[0];

      secretCaseFile = { suspect: rSuspect, weapon: rWeapon, room: rRoom };

      let deck = [...suspects, ...weapons, ...rooms];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      const hands = {};
      gameState.players.forEach(p => hands[p.id] = []);

      let pIdx = 0;
      while (deck.length > 0) {
        hands[gameState.players[pIdx].id].push(deck.pop());
        pIdx = (pIdx + 1) % gameState.players.length;
      }

      myCards = hands[myId] || [];
      renderMyCards();
      initNotebook();

      connections.forEach(conn => {
        if (conn.open && hands[conn.peer]) {
          conn.send({ type: 'DEAL_CARDS', cards: hands[conn.peer] });
        }
      });
    }

    // --- GESTIONE CHIAMATA (SUGGESTION) A GIRO ORARIO ---
    function initiateSuggestion(callerId, suggestion) {
      const callerIndex = gameState.players.findIndex(p => p.id === callerId);
      if (callerIndex === -1) return;

      gameState.activeSuggestion = {
        callerId: callerId,
        callerName: gameState.players[callerIndex].name,
        suggestion: suggestion,
        currentRespondentIndex: (callerIndex + 1) % gameState.players.length,
        startIndex: callerIndex
      };

      broadcastState();
      askNextRespondent();
    }

    function askNextRespondent() {
      const act = gameState.activeSuggestion;
      if (!act) return;

      // Se il giro completo è finito e nessuno ha risposto
      if (act.currentRespondentIndex === act.startIndex) {
        sendToPlayer(act.callerId, {
          type: 'SUGGESTION_RESULT',
          callerId: act.callerId,
          disproved: false,
          card: null,
          responderName: null
        });

        broadcastExceptCaller(act.callerId, {
          type: 'SUGGESTION_RESULT',
          callerId: act.callerId,
          disproved: false,
          responderName: null
        });

        endSuggestionTurn();
        return;
      }

      const targetPlayer = gameState.players[act.currentRespondentIndex];

      if (targetPlayer.id === myId) {
        openDisproveModal(act.suggestion);
      } else {
        const conn = connections.find(c => c.peer === targetPlayer.id);
        if (conn && conn.open) {
          conn.send({ type: 'PROMPT_DISPROVE', suggestion: act.suggestion });
        }
      }
    }

    function processDisproveResponse(respondentId, card, hasCard) {
      const act = gameState.activeSuggestion;
      if (!act) return;

      const respondent = gameState.players.find(p => p.id === respondentId);
      const respondentName = respondent ? respondent.name : 'Un giocatore';

      if (hasCard && card) {
        // Carta mostrata in privato ESCLUSIVAMENTE al chiamante
        sendToPlayer(act.callerId, {
          type: 'SUGGESTION_RESULT',
          callerId: act.callerId,
          disproved: true,
          card: card,
          responderName: respondentName
        });

        // Agli altri si notifica che l'ipotesi è stata smentita senza mostrare la carta
        broadcastExceptCaller(act.callerId, {
          type: 'SUGGESTION_RESULT',
          callerId: act.callerId,
          disproved: true,
          card: null,
          responderName: respondentName
        });

        endSuggestionTurn();
      } else {
        // Il giocatore passa; si interroga il successivo a sinistra (senso orario)
        act.currentRespondentIndex = (act.currentRespondentIndex + 1) % gameState.players.length;
        askNextRespondent();
      }
    }

    function endSuggestionTurn() {
      gameState.activeSuggestion = null;
      gameState.stepsLeft = 0;
      gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
      broadcastState();
    }

    function sendToPlayer(playerId, message) {
      if (playerId === myId) {
        if (message.type === 'SUGGESTION_RESULT') handleSuggestionResult(message);
      } else {
        const conn = connections.find(c => c.peer === playerId);
        if (conn && conn.open) conn.send(message);
      }
    }

    function broadcastExceptCaller(callerId, message) {
      if (myId !== callerId) {
        if (message.type === 'SUGGESTION_RESULT') handleSuggestionResult(message);
      }
      connections.forEach(conn => {
        if (conn.open && conn.peer !== callerId) {
          conn.send(message);
        }
      });
    }

    function handleSuggestionResult(data) {
      if (data.callerId === myId) {
        if (data.disproved) {
          showCustomAlert(`🕵️ ${data.responderName} ti ha mostrato in segreto la carta:\n👉 [ ${data.card} ]`);
        } else {
          showCustomAlert(`🔍 Nessun giocatore ha potuto smentire la tua ipotesi! Nessuno possiede quelle 3 carte.`);
        }
      } else {
        if (data.disproved) {
          showCustomAlert(`ℹ️ ${data.responderName} ha mostrato una carta segreta a chi ha fatto la chiamata.`);
        } else {
          showCustomAlert(`ℹ️ Nessun giocatore ha potuto smentire l'ipotesi formulata.`);
        }
      }
    }

    // --- INTERFACCIA CHIAMATA E RISPOSTA ---
    function openSuggestModal() {
      populateSuggestSelects();
      openModal('suggest-modal');
    }

    function populateSuggestSelects() {
      const sSelect = document.getElementById('suggestSuspect');
      const wSelect = document.getElementById('suggestWeapon');
      const rSelect = document.getElementById('suggestRoom');

      sSelect.innerHTML = ALL_CARDS.suspects.map(s => `<option value="${s}">${s}</option>`).join('');
      wSelect.innerHTML = ALL_CARDS.weapons.map(w => `<option value="${w}">${w}</option>`).join('');
      rSelect.innerHTML = ALL_CARDS.rooms.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function submitSuggestion() {
      const suggestion = {
        suspect: document.getElementById('suggestSuspect').value,
        weapon: document.getElementById('suggestWeapon').value,
        room: document.getElementById('suggestRoom').value
      };

      closeModal('suggest-modal');

      if (isHost) {
        initiateSuggestion(myId, suggestion);
      } else {
        hostConn.send({ type: 'START_SUGGESTION', suggestion: suggestion });
      }
    }

    function openDisproveModal(sugg) {
      const banner = document.getElementById('disprove-banner');
      banner.innerHTML = `
        <strong>Ipotesi da smentire:</strong><br>
        👤 Sospettato: <strong>${sugg.suspect}</strong><br>
        🔪 Arma: <strong>${sugg.weapon}</strong><br>
        🚪 Stanza: <strong>${sugg.room}</strong>
      `;

      const listDiv = document.getElementById('disprove-cards-list');
      listDiv.innerHTML = '';

      const matchedCards = myCards.filter(c => c === sugg.suspect || c === sugg.weapon || c === sugg.room);

      if (matchedCards.length > 0) {
        matchedCards.forEach(card => {
          const btn = document.createElement('button');
          btn.textContent = `Mostra segretamente: ${card}`;
          btn.style.cssText = 'background: #10b981; color: #000; font-weight: 700; padding: 12px; font-size: 14px;';
          btn.onclick = () => {
            closeModal('disprove-modal');
            sendDisproveChoice(card, true);
          };
          listDiv.appendChild(btn);
        });
      } else {
        const noMatchMsg = document.createElement('div');
        noMatchMsg.textContent = 'Non hai nessuna delle carte richieste tra le tue.';
        noMatchMsg.style.cssText = 'color: #94a3b8; font-size: 13px; font-style: italic;';
        listDiv.appendChild(noMatchMsg);
      }

      openModal('disprove-modal');
    }

    function passDisprove() {
      closeModal('disprove-modal');
      sendDisproveChoice(null, false);
    }

    function sendDisproveChoice(card, hasCard) {
      if (isHost) {
        processDisproveResponse(myId, card, hasCard);
      } else {
        hostConn.send({ type: 'DISPROVE_RESPONSE', card: card, hasCard: hasCard });
      }
    }

    function executeMove(playerId, targetX, targetY) {
      const activePlayer = gameState.players[gameState.turnIndex];
      if (!activePlayer || activePlayer.id !== playerId || gameState.stepsLeft <= 0 || gameState.activeSuggestion) return;

      const dx = Math.abs(activePlayer.x - targetX);
      const dy = Math.abs(activePlayer.y - targetY);

      if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
        activePlayer.x = targetX;
        activePlayer.y = targetY;
        gameState.stepsLeft--;

        if (isHost) broadcastState();
      }
    }

    function broadcastState() {
      connections.forEach(conn => {
        if (conn.open) conn.send({ type: 'SYNC', state: gameState });
      });
      if (gameState.started) updateUI();
    }

    function rollDice() {
      if (gameState.activeSuggestion) return;
      if (isHost) {
        if (gameState.players[gameState.turnIndex].id === myId && gameState.stepsLeft === 0) {
          gameState.stepsLeft = Math.floor(Math.random() * 6) + 1;
          broadcastState();
        }
      } else {
        hostConn.send({ type: 'ACTION_ROLL' });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      const activePlayer = gameState.players[gameState.turnIndex];
      if (!activePlayer || activePlayer.id !== myId || gameState.stepsLeft <= 0 || gameState.activeSuggestion) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor(((e.clientX - rect.left) * scaleX) / TILE);
      const y = Math.floor(((e.clientY - rect.top) * scaleY) / TILE);

      if (isHost) {
        executeMove(myId, x, y);
      } else {
        hostConn.send({ type: 'ACTION_MOVE', x, y });
      }
    });

    // 4. GESTIONE SCHERMATE E INTERFACCIA
    function showWaitingScreen() {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('waiting-screen').style.display = 'flex';
      document.getElementById('game-container').style.display = 'none';
    }

    function showGameView() {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('waiting-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
    }

    function updateWaitingRoomUI() {
      const listUl = document.getElementById('player-list-ul');
      const countSpan = document.getElementById('player-count');
      listUl.innerHTML = '';

      countSpan.textContent = `${gameState.players.length}/6`;

      gameState.players.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-item';

        const dot = document.createElement('span');
        dot.className = 'color-dot';
        dot.style.background = p.color;

        const nameSpan = document.createElement('span');
        nameSpan.textContent = p.name + (p.id === myId ? ' (Tu)' : '');

        li.appendChild(dot);
        li.appendChild(nameSpan);

        if (p.isHost) {
          const hostBadge = document.createElement('span');
          hostBadge.textContent = 'HOST';
          hostBadge.style.cssText = 'font-size: 10px; background: #f59e0b; color: #000; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: auto;';
          li.appendChild(hostBadge);
        }

        listUl.appendChild(li);
      });
    }

    function copyRoomCode() {
      const code = document.getElementById('display-room-code').textContent;
      const tempInput = document.createElement('input');
      tempInput.value = code;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showCustomAlert('Codice stanza copiato negli appunti!');
    }

    function updateUI() {
      draw();
      const activePlayer = gameState.players[gameState.turnIndex];
      if (!activePlayer) return;

      const isMyTurn = (activePlayer.id === myId);
      const statusDiv = document.getElementById('status');
      const diceBtn = document.getElementById('diceBtn');
      const suggestBtn = document.getElementById('suggestBtn');

      if (gameState.activeSuggestion) {
        statusDiv.innerHTML = `🔍 Chiamata di <strong>${gameState.activeSuggestion.callerName}</strong> in verifica...`;
        diceBtn.disabled = true;
        suggestBtn.disabled = true;
        return;
      }

      if (isMyTurn) {
        suggestBtn.disabled = false;
        if (gameState.stepsLeft > 0) {
          statusDiv.innerHTML = `<strong>Tocca a te!</strong> Passi: <strong>${gameState.stepsLeft}</strong> (o formula un'ipotesi)`;
          diceBtn.disabled = true;
        } else {
          statusDiv.innerHTML = `<strong>Tocca a te!</strong> Tira il dado o fai una chiamata.`;
          diceBtn.disabled = false;
        }
      } else {
        const activeNameSafe = document.createElement('span');
        activeNameSafe.textContent = activePlayer.name;
        statusDiv.innerHTML = 'Turno di: ';
        const strong = document.createElement('strong');
        strong.appendChild(activeNameSafe);
        statusDiv.appendChild(strong);
        diceBtn.disabled = true;
        suggestBtn.disabled = true;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
          ctx.strokeStyle = '#334155';
          ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
      }

      gameState.players.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x * TILE + TILE / 2, p.y * TILE + TILE / 2, TILE / 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        if (p.id === myId) {
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('IO', p.x * TILE + TILE / 2, p.y * TILE + TILE / 1.5);
        }
      });
    }

    // --- TACCUINO & CARTE ---
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showCustomAlert(msg) {
      document.getElementById('custom-alert-msg').textContent = msg;
      openModal('custom-alert-modal');
    }

    function renderMyCards() {
      const container = document.getElementById('my-cards-container');
      container.innerHTML = '';

      if (myCards.length === 0) {
        container.innerHTML = '<div style="color: #94a3b8; font-size: 13px;">Nessuna carta assegnata.</div>';
        return;
      }

      myCards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card-pill';
        div.textContent = card;
        container.appendChild(div);
      });
    }

    function initNotebook() {
      ['suspects', 'weapons', 'rooms'].forEach(cat => {
        ALL_CARDS[cat].forEach(item => {
          if (!notebookState[item]) {
            notebookState[item] = myCards.includes(item) ? 'yes' : 'none';
          }
        });
      });
      renderNotebookSection('suspects-notebook', ALL_CARDS.suspects);
      renderNotebookSection('weapons-notebook', ALL_CARDS.weapons);
      renderNotebookSection('rooms-notebook', ALL_CARDS.rooms);
    }

    function renderNotebookSection(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      list.forEach(item => {
        const row = document.createElement('div');
        row.className = 'sheet-row';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = item;
        nameSpan.style.fontSize = '13px';

        const statusBtn = document.createElement('button');
        statusBtn.className = 'sheet-status-btn';
        updateStatusBtn(statusBtn, notebookState[item]);

        statusBtn.onclick = () => {
          cycleStatus(item, statusBtn);
        };

        row.appendChild(nameSpan);
        row.appendChild(statusBtn);
        container.appendChild(row);
      });
    }

    function cycleStatus(item, btn) {
      const order = ['none', 'no', 'yes', 'maybe'];
      const nextIdx = (order.indexOf(notebookState[item]) + 1) % order.length;
      notebookState[item] = order[nextIdx];
      updateStatusBtn(btn, notebookState[item]);
    }

    function updateStatusBtn(btn, status) {
      btn.className = 'sheet-status-btn';
      if (status === 'none') {
        btn.textContent = '·';
        btn.classList.add('status-none');
      } else if (status === 'no') {
        btn.textContent = '✕';
        btn.classList.add('status-no');
      } else if (status === 'yes') {
        btn.textContent = '✓';
        btn.classList.add('status-yes');
      } else if (status === 'maybe') {
        btn.textContent = '?';
        btn.classList.add('status-maybe');
      }
    }
  </script>
</body>
</html>
